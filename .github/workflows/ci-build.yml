name: Build
on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Package install
      run: ./ci_prereq.sh
      env:
          TC201_ARCHIVE_PATHNAME: ${{ vars.TC201_ARCHIVE_PATHNAME }}
          TC201_ARCHIVE_FILENAME: ${{ vars.TC201_ARCHIVE_FILENAME }}
          TC201_ARCHIVE_PASSPHRASE: ${{ secrets.TC201_ARCHIVE_PASSPHRASE }}

    - name: build
      run: ./ci_build.sh

    - name: test
      run: ./ci_test.sh

    - name: make snapshot name
      id: snapshotname
      run: |
        (
          today=`date -u +%F | tr '\n' '-'`
          s_sha=`echo -n ${GITHUB_SHA} | cut -c1-8`
          printf "fname=snapshot-%s%s\n" $today $s_sha >> $GITHUB_OUTPUT
        )

    - name: upload
      if: github.repository == 'FDOS/kernel' &&
        (github.event_name == 'push' || github.event.pull_request.merged == true)
      uses: actions/upload-artifact@v6
      with:
        name: ${{ steps.snapshotname.outputs.fname }}
        path: _output/*/*.???

  loongarch64_uefi:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install LoongArch64 cross-tools
      run: |
        set -eux
        target=loongarch64-unknown-linux-gnu
        mkdir -p "$HOME/x-tools"
        curl -fL "https://github.com/loong64/cross-tools/releases/latest/download/${target}.tar.xz" -o /tmp/${target}.tar.xz
        tar -xf /tmp/${target}.tar.xz -C "$HOME/x-tools"
        tool_bin="$(find "$HOME/x-tools" -type f -name "${target}-gcc" | head -n1 | xargs dirname)"
        test -n "$tool_bin"
        echo "$tool_bin" >> "$GITHUB_PATH"

    - name: Build LoongArch64 UEFI milestone 2 artifact
      run: make loongarch64_uefi

    - name: Upload LoongArch64 UEFI artifact
      uses: actions/upload-artifact@v6
      with:
        name: loongarch64-uefi-${{ github.sha }}
        path: _output/loongarch64_uefi/*
